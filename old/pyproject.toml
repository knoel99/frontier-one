[project]
name = "frontier-one"
version = "0.1.0"
description = "Control plane of a science hackathon run by AI agents"
requires-python = ">=3.11"

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E402", "E731", "I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
