# A mission: what the owner gives the AI. Copy this file, fill it, then:
#   python3 -m frontier mission start my-mission.toml          # prepares the workspace and launches the harness
#   python3 -m frontier mission start my-mission.toml --prepare-only
# Keys are never written here: [secrets] says where each one is read from (see the end of this file).

[mission]
name = "milady-2027"
subject = "subject/stage_milady_2027.pdf"   # file (copied into the workspace) or URL (downloaded) of the subject
workspace = "../mission-milady-2027"        # created as a new git repository if missing
duration_hours = 72                          # or: deadline = "2026-11-21T18:00:00+01:00"

[harness]
name = "auto"            # auto = the LLM provider's own harness, else opencode; or any name of `frontier harnesses`
tier = "frontier"        # model tier of the main thread
reasoning = "high"       # reasoning level of the main thread (none, low, medium, high, max)
max_sessions = 20        # the launcher restarts the harness until `deliver` is called, the deadline or a budget ends

[llm]
provider = "openai"      # section of config/providers.toml
budget_usd = 50.0        # all LLM calls of the mission: the harness (metered by the gateway) and every sub-agent
other_providers = []     # more providers usable by spawn_agent

[scaleway]                # a section turns a service of config/providers.toml [services.*] on
budget_eur = 30.0

[runpod]
budget_usd = 30.0

[huggingface]
namespace = ""           # user or organisation; default: the token's user
visibility = "private"   # private or public: who can see what the AI publishes

[sandbox]
kind = "none"            # none, or openshell: the harness runs in an NVIDIA OpenShell sandbox (deny-by-default network,
                         # keys injected by OpenShell's proxy and never visible inside; see frontier/sandbox.py)
base_image = "node:22-bookworm"
# build_ca_bundle = "/path/to/ca.pem"   # a host behind a TLS-intercepting proxy: its CA, trusted while the image builds
# cpu = 4
# memory = "8Gi"

[network]
# With a sandbox: hosts the AI may read from during its research (GET only, L7-enforced), on top of the model API,
# Scaleway, Runpod, Hugging Face and the package registries. deny removes hosts from this list.
allow = ["arxiv.org", "export.arxiv.org", "api.semanticscholar.org", "doi.org", "github.com", "raw.githubusercontent.com"]
deny = []

[grading]
# Shown to the AI as the evaluation. Weights are optional; without them the criteria are listed unweighted.
criteria = ["scientific quality", "code and data", "efficiency: total spend and time, absolute and against the other teams"]
weights = [50, 25, 25]

[snapshots]
# At these times and total spends (model calls + simulations, local CPU billed), a notice asks the AI to bring its
# report up to date; grace_minutes later the workspace is committed and tagged snapshot-<label> (frontier/snapshots.py).
# Both lists go on doubling past their last value. Milestones before notice_from_minutes are snapshotted silently.
enabled = true
grace_minutes = 5
notice_from_minutes = 15
time_minutes = [5, 15, 30, 60, 120, 240, 480]
spend_usd = [5, 10, 20, 50, 100, 200, 500, 1000, 2000, 5000]

[secrets]
# Where each key and setting comes from, by its standard variable name (config/providers.toml: `key_env` of a model
# provider, `env` and `settings` of a service). Resolved once by the launcher on the host; only the origin is recorded.
# Default for each one: env:<its own name>. A key with no value is sent as a placeholder for a proxy to replace.
#   env:NAME      another environment variable
#   file:PATH     a file, e.g. /run/secrets/openai (Docker, Kubernetes) or a systemd credential
#   cmd:COMMAND   the output of any secret manager's CLI
#   proxy         an outer proxy injects it (a Claude Code cloud session, a corporate egress proxy)
# OPENAI_API_KEY = "cmd:vault kv get -field=key secret/race/openai"
# SCW_SECRET_KEY = "cmd:aws secretsmanager get-secret-value --secret-id scw --query SecretString --output text"
# RUNPOD_API_KEY = "file:/run/secrets/runpod"
# HF_TOKEN = "cmd:op read op://race/hf/token"
# SCW_DEFAULT_PROJECT_ID = "env:MY_PROJECT"
