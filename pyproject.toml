[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frontier"
version = "0.2.0"
description = "Provider-agnostic API agents that start API sub-agents, with offline cloud API docs"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
publish = ["huggingface_hub>=1.0"]
math = ["sympy"]
dev = ["pytest", "ruff", "pyyaml", "sympy"]

[project.scripts]
frontier = "frontier.__main__:main"
frontier-mcp = "frontier.mcp:main"

[tool.setuptools]
packages = ["frontier"]

[tool.setuptools.package-data]
frontier = ["web/*", "logos.svg"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
# BLE: an `except Exception` says on its line why swallowing is right. PLW1510: a subprocess.run says what a failed
# command does (check=True raises, check=False means the code reads the exit status). RUF100: a `noqa` that suppresses
# nothing is removed.
select = ["E", "F", "I", "UP", "B", "BLE", "PLW1510", "RUF100"]
ignore = ["E402", "E731", "I001", "E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
