[project]
name = "frontier"
version = "0.2.0"
description = "Provider-agnostic API agents that start API sub-agents, with offline cloud API docs"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff", "pyyaml"]

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = ["old"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E402", "E731", "I001", "E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
